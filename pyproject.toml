[project]
name = "erp-sim"
version = "0.11.0"
description = "Composable ERP protocol CLI with a versioned JSON contract for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
erp-sim = "erp_sim.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "connection.example.toml",
    "docs/features/**",
    "examples/**",
    "docs/mac-login-verification.md",
    ".agents/skills/erp-sim/**",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
]
